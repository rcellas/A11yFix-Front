<div class="field-container" [class.field-has-error]="hasError()">
  <label [for]="id()" class="field-label">
    {{ label() }}
    @if (required()) {
      <span class="field-required" aria-hidden="true">*</span>
      <span class="sr-only">(Requerido)</span>
    }
  </label>

  <div class="field-input-wrapper">
    <input
      [id]="id()"
      [type]="type()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="handleInput($event)"
      class="field-input"
    />
  </div>

  @if (errorMessage()) {
    <p [id]="id() + '-error'" class="field-message field-error" role="alert">
      {{ errorMessage() }}
    </p>
  } @else if (helperText()) {
    <p [id]="id() + '-helper'" class="field-message field-helper">
      {{ helperText() }}
    </p>
  }
</div>
