<!-- Skip to main content landmark -->
<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="app-layout">
  <!-- Header Landmark -->
  <header class="app-header" role="banner">
    <div class="header-content">
      <div class="brand-group">
        <div class="brand-logo-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="m4.93 4.93 4.24 4.24"/>
            <path d="m14.83 9.17 4.24-4.24"/>
            <path d="m14.83 14.83 4.24 4.24"/>
            <path d="m9.17 14.83-4.24 4.24"/>
            <circle cx="12" cy="12" r="4"/>
          </svg>
        </div>
        <a routerLink="/" class="brand-title-link" aria-label="A11yFix — go to audit workspace">
          <h1 class="brand-title">A11yFix <span class="brand-badge">QA PRO</span></h1>
        </a>
      </div>

      <nav class="header-nav" aria-label="Main navigation">
        <a routerLink="/" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          Audit Workspace
        </a>
        <a routerLink="/how-it-works" routerLinkActive="nav-link--active" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          Instructions & Guide
        </a>
      </nav>

      <div class="header-badges">
        <div class="status-pill standard-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
          <span>WCAG 2.2 AA</span>
        </div>

        <div class="status-pill webmcp-pill">
          <span class="live-dot" aria-hidden="true"></span>
          <span>WebMCP Host Active ({{ webMcpHost.registeredToolNames().length }} Tools)</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Landmark — Router Outlet -->
  <main id="main-content" class="app-main" role="main">
    <router-outlet />
  </main>
</div>
