<!-- Skip to main content landmark -->
<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="app-layout">
  <!-- Header Landmark -->
  <header class="app-header" role="banner">
    <div class="header-content">
      <div class="brand-group">
        <span class="brand-icon" aria-hidden="true">⚡</span>
        <h1 class="brand-title">A11yFix <span class="brand-subtitle">Web QA Workbench</span></h1>
      </div>

      <div class="header-badges">
        <app-badge variant="info">WCAG 2.2 Level AA Standard</app-badge>
        <button
          class="webmcp-badge-btn"
          (click)="webMcpHost.togglePanel()"
          aria-label="Open WebMCP Host Inspector panel"
          title="Click to open live WebMCP tools & telemetry inspector"
        >
          <app-badge variant="success">⚡ WebMCP Host ({{ webMcpHost.registeredToolNames().length }} Tools Active)</app-badge>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Landmark -->
  <main id="main-content" class="app-main" role="main">
    <div class="main-container">
      <!-- Scanner Bar -->
      <app-audit-workspace />

      @if (auditFacade.isCompleted()) {
        <!-- Split Workspace: Findings List + Finding Detail -->
        <div class="workspace-grid">
          <aside class="grid-col findings-col" aria-label="Findings Navigation">
            <app-findings-list />
          </aside>

          <section class="grid-col detail-col" aria-label="Finding Inspection and Remediation">
            <app-finding-detail />
          </section>
        </div>
      }
    </div>
  </main>

  <!-- WebMCP Inspector Drawer Panel -->
  @if (webMcpHost.isPanelOpen()) {
    <app-webmcp-panel />
  }
</div>
