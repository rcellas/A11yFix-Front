<!-- Skip to main content landmark -->
<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="app-layout">
  <!-- Header Landmark -->
  <header class="app-header" role="banner">
    <div class="header-content">
      <div class="brand-group">
        <span class="brand-icon" aria-hidden="true">⚡</span>
        <h1 class="brand-title">A11yFix <span class="brand-subtitle">Web QA Workbench</span></h1>
      </div>

      <div class="header-badges">
        <app-badge variant="info">WCAG 2.2 Level AA Standard</app-badge>
        <app-badge variant="success">⚡ WebMCP Host Active ({{ webMcpHost.registeredToolNames().length }} Tools)</app-badge>
      </div>
    </div>
  </header>

  <!-- Main Landmark -->
  <main id="main-content" class="app-main" role="main">
    <div class="main-container">
      <!-- Scanner & WebMCP Inspector Bar -->
      <app-audit-workspace />

      @if (auditFacade.isCompleted()) {
        @if ((auditFacade.report()?.findings?.length ?? 0) === 0) {
          <!-- Full-Width 100% WCAG 2.2 Compliance Pass Report -->
          <app-compliance-success />
        } @else {
          <!-- Split Workspace: Findings List + Finding Detail -->
          <div class="workspace-grid">
            <aside class="grid-col findings-col" aria-label="Findings Navigation">
              <app-findings-list />
            </aside>

            <section class="grid-col detail-col" aria-label="Finding Inspection and Remediation">
              <app-finding-detail />
            </section>
          </div>
        }
      }
    </div>
  </main>
</div>
